display_information:
  name: Coder Slackbot
  description: AI assistant powered by Coder
  background_color: "#2B2D31"
features:
  bot_user:
    display_name: Coder Slackbot
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - reactions:write
      - channels:history
      - groups:history
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
